<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotesApp Using JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="container mx-auto mt-5 p-4 w-50">
        <div class="content">
            <form action="" class="form p-4 card bg-body-secondary text-dark" id="notesapp">
                <h2><b><u>NotesApp:</u></b></h2>
                <hr>
                <input type="text" class="form-control m-2 bg-light text-dark" placeholder="Enter Title" id="title">
                <textarea name="" id="message" class="form-control m-2 bg-light text-dark" cols="6" rows="8"
                    placeholder="Enter Message"></textarea>
                <div class="text-center mt-2">
                    <button type="submit" class="btn btn-dark w-50">Enter</button>
                </div>
            </form>
        </div>
    </div>

    <div class="container card pt-4 w-75">
        <h2><b><u>All Data Preview:</u></b></h2>
        <div class="preview row justify-content-left p-2" id="preview">

        </div>
    </div>

    </div>
    </div>

</body>
<script src="./script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
